<meta charset="utf-8">
<title>Hero automatisation — système de nœuds</title>
<link rel="stylesheet" href="hero-commun.css">
<style>

  /* ── Le canevas ──────────────────────────────────────────────────────────
     Caricature d'un éditeur de scénarios type Make ou n8n : nœuds arrondis
     surdimensionnés, liens en courbe, paquets qui circulent. On ne cherche
     PAS à imiter l'interface — on en garde la grammaire visuelle. */

  /* Trame de fond : la grille de points des éditeurs de workflow. */

  /* Les liens : un tracé sourd, plus un tracé lumineux qui défile par-dessus. */}
  
  /* Icônes vectorielles : contour seul, hérité de la palette, jamais d'emoji. */

  @media (prefers-reduced-motion:reduce){
    .lien-vif,.boite-actif,
  }
</style>

<body class="apercu">
<div class="canevas">
  <svg class="large" viewBox="0 0 920 430" role="img"
       aria-label="Schéma animé d'un scénario d'automatisation : un e-mail entrant est analysé par un agent, puis routé vers le CRM ou vers la facturation.">
    <defs>
      <linearGradient id="flux" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>

      <!-- Les tracés sont déclarés une fois puis réutilisés : le lien visible,
           le lien lumineux et le paquet suivent exactement la même courbe. -->
      <path id="t1" d="M 196 215 C 258 215, 258 215, 320 215"/>
      <path id="t2" d="M 470 215 C 528 215, 528 215, 586 215"/>
      <path id="t3" d="M 700 196 C 748 196, 752 120, 800 120"/>
      <path id="t4" d="M 700 234 C 748 234, 752 310, 800 310"/>
    </defs>

    <!-- ── Liens ── -->
    <use href="#t1" class="lien"/><use href="#t2" class="lien"/>
    <use href="#t3" class="lien"/><use href="#t4" class="lien"/>
    <use href="#t1" class="lien-vif"/>
    <use href="#t2" class="lien-vif" style="animation-delay:.45s"/>
    <use href="#t3" class="lien-vif" style="animation-delay:.95s"/>
    <use href="#t4" class="lien-vif" style="animation-delay:.95s"/>

    <!-- ── Nœud 1 : le déclencheur ──
         Icônes en tracés vectoriels, PAS en emoji : un emoji dépend de la
         police système, se colore tout seul et casse la cohérence de la
         palette. Deux d'entre eux ne s'affichaient d'ailleurs pas du tout. -->
    <g class="boite-actif">
      <rect x="36" y="176" width="160" height="78" rx="18" class="boite"/>
    </g>
    <g class="icone">
      <rect x="56" y="205" width="22" height="16" rx="3"/>
      <path d="M 56 208 L 67 216 L 78 208"/>
    </g>
    <text x="92" y="208" class="titre">E-mail reçu</text>
    <text x="92" y="226" class="sstitre">Déclencheur</text>

    <!-- ── Nœud 2 : l'agent ── -->
    <g class="boite-actif" style="animation-delay:.45s">
      <rect x="320" y="170" width="150" height="90" rx="18" class="boite"/>
    </g>
    <circle cx="352" cy="215" r="16" fill="url(#accent)" opacity=".95"/>
    <path d="M 352 205 L 355 212 L 362 215 L 355 218 L 352 225 L 349 218 L 342 215 L 349 212 Z"
          fill="#0b0819" opacity=".9"/>
    <text x="378" y="205" class="titre">Agent IA</text>
    <text x="378" y="222" class="sstitre">Lit, comprend,</text>
    <text x="378" y="236" class="sstitre">décide</text>

    <!-- ── Nœud 3 : l'aiguillage ── -->
    <g class="boite-actif" style="animation-delay:.95s">
      <rect x="586" y="182" width="114" height="66" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <path d="M 604 222 L 611 222 C 615 222, 615 208, 619 208 L 625 208"/>
      <path d="M 611 222 C 615 222, 615 234, 619 234 L 625 234"/>
      <circle cx="604" cy="222" r="2.6" fill="url(#accent)" stroke="none"/>
    </g>
    <text x="634" y="209" class="titre">Routage</text>
    <text x="634" y="226" class="sstitre">Selon le cas</text>

    <!-- ── Sorties ── -->
    <g class="boite-actif" style="animation-delay:1.35s">
      <rect x="800" y="88" width="98" height="64" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <circle cx="822" cy="114" r="4.5"/>
      <path d="M 815 126 C 815 120, 829 120, 829 126"/>
    </g>
    <text x="838" y="115" class="titre">CRM</text>
    <text x="838" y="132" class="sstitre">Fiche créée</text>

    <g class="boite-actif" style="animation-delay:1.35s">
      <rect x="800" y="278" width="98" height="64" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <rect x="815" y="298" width="15" height="19" rx="2.5"/>
      <path d="M 819 304 L 826 304 M 819 309 L 826 309 M 819 313 L 823 313"/>
    </g>
    <text x="838" y="305" class="titre">Devis</text>
    <text x="838" y="322" class="sstitre">Envoyé</text>

    <!-- ── Paquets qui circulent ── -->
    <circle class="paquet" fill="#c4b5fd">
      <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#t1"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#a855f7">
      <animateMotion dur="3.2s" begin="0.45s" repeatCount="indefinite">
        <mpath href="#t2"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#06b6d4">
      <animateMotion dur="3.2s" begin="0.95s" repeatCount="indefinite">
        <mpath href="#t3"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#06b6d4">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite">
        <mpath href="#t4"/></animateMotion>
    </circle>
  </svg>

  <!-- ── Cadrage étroit : le flux DESCEND ────────────────────────────────────
       Ce n'est pas la version paysage rétrécie. Sur 420 de large, le texte de
       13 px se rend à ~13 px : lisible. Les deux sorties passent côte à côte
       en bas plutôt qu'en haut/bas à droite. -->
  <svg class="etroit" viewBox="0 0 420 700" role="img"
       aria-label="Schéma animé d'un scénario d'automatisation : un e-mail entrant est analysé par un agent, puis routé vers le CRM ou vers la facturation.">
    <defs>
      <linearGradient id="fluxV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <path id="v1" d="M 210 148 L 210 226"/>
      <path id="v2" d="M 210 342 L 210 420"/>
      <path id="v3" d="M 180 514 C 180 556, 128 556, 128 588"/>
      <path id="v4" d="M 240 514 C 240 556, 292 556, 292 588"/>
    </defs>

    <use href="#v1" class="lien"/><use href="#v2" class="lien"/>
    <use href="#v3" class="lien"/><use href="#v4" class="lien"/>
    <use href="#v1" class="lien-vif" style="stroke:url(#fluxV)"/>
    <use href="#v2" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.45s"/>
    <use href="#v3" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.95s"/>
    <use href="#v4" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.95s"/>

    <g class="boite-actif"><rect x="66" y="62" width="288" height="86" rx="20" class="boite"/></g>
    <g class="icone"><rect x="94" y="96" width="26" height="19" rx="3"/><path d="M 94 100 L 107 110 L 120 100"/></g>
    <text x="136" y="100" class="titre">E-mail reçu</text>
    <text x="136" y="122" class="sstitre">Déclencheur</text>

    <g class="boite-actif" style="animation-delay:.45s"><rect x="66" y="226" width="288" height="116" rx="20" class="boite"/></g>
    <circle cx="106" cy="284" r="19" fill="url(#accentV)"/>
    <path d="M 106 272 L 110 280 L 118 284 L 110 288 L 106 296 L 102 288 L 94 284 L 102 280 Z" fill="#0b0819" opacity=".9"/>
    <text x="138" y="272" class="titre">Agent IA</text>
    <text x="138" y="294" class="sstitre">Lit, comprend,</text>
    <text x="138" y="312" class="sstitre">décide</text>

    <g class="boite-actif" style="animation-delay:.95s"><rect x="66" y="420" width="288" height="94" rx="20" class="boite"/></g>
    <g class="icone"><path d="M 96 470 L 106 470 C 112 470, 112 452, 118 452 L 128 452"/><path d="M 106 470 C 112 470, 112 488, 118 488 L 128 488"/><circle cx="96" cy="470" r="3.4" fill="url(#accentV)" stroke="none"/></g>
    <text x="146" y="464" class="titre">Routage</text>
    <text x="146" y="486" class="sstitre">Selon le cas</text>

    <g class="boite-actif" style="animation-delay:1.35s"><rect x="46" y="588" width="164" height="80" rx="18" class="boite"/></g>
    <g class="icone"><circle cx="76" cy="618" r="6"/><path d="M 66 634 C 66 625, 86 625, 86 634"/></g>
    <text x="98" y="618" class="titre">CRM</text>
    <text x="98" y="638" class="sstitre">Fiche créée</text>

    <g class="boite-actif" style="animation-delay:1.35s"><rect x="210" y="588" width="164" height="80" rx="18" class="boite"/></g>
    <g class="icone"><rect x="238" y="606" width="19" height="24" rx="3"/><path d="M 243 613 L 252 613 M 243 619 L 252 619 M 243 625 L 248 625"/></g>
    <text x="266" y="618" class="titre">Devis</text>
    <text x="266" y="638" class="sstitre">Envoyé</text>

    <circle class="paquet" fill="#c4b5fd"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#v1"/></animateMotion></circle>
    <circle class="paquet" fill="#a855f7"><animateMotion dur="3.2s" begin="0.45s" repeatCount="indefinite"><mpath href="#v2"/></animateMotion></circle>
    <circle class="paquet" fill="#06b6d4"><animateMotion dur="3.2s" begin="0.95s" repeatCount="indefinite"><mpath href="#v3"/></animateMotion></circle>
    <circle class="paquet" fill="#06b6d4"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#v4"/></animateMotion></circle>
  </svg>
</div>
