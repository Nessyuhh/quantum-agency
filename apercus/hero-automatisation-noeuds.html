<meta charset="utf-8">
<title>Hero automatisation — système de nœuds</title>
<style>
  :root{--purple:#7c3aed;--purple-l:#a855f7;--cyan:#06b6d4;--amber:#f59e0b;
        --bg:#05050a;--text:#f1f5f9;--muted:#94a3b8}
  body{margin:0;background:#0a0713;font-family:Inter,-apple-system,system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

  /* ── Le canevas ──────────────────────────────────────────────────────────
     Caricature d'un éditeur de scénarios type Make ou n8n : nœuds arrondis
     surdimensionnés, liens en courbe, paquets qui circulent. On ne cherche
     PAS à imiter l'interface — on en garde la grammaire visuelle. */
  .canevas{position:relative;width:100%;max-width:920px;aspect-ratio:920/430;
           border-radius:26px;overflow:hidden;
           background:radial-gradient(120% 140% at 12% 0%,rgba(124,58,237,.20),transparent 55%),
                      radial-gradient(110% 130% at 92% 100%,rgba(6,182,212,.16),transparent 55%),
                      #0b0819;
           border:1px solid rgba(168,85,247,.20);
           box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}

  /* Trame de fond : la grille de points des éditeurs de workflow. */
  .canevas::before{content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
    background-size:26px 26px;opacity:.5}

  svg{position:absolute;inset:0;width:100%;height:100%}

  /* Les liens : un tracé sourd, plus un tracé lumineux qui défile par-dessus. */
  .lien{fill:none;stroke:rgba(168,85,247,.22);stroke-width:2.5;stroke-linecap:round}
  .lien-vif{fill:none;stroke:url(#flux);stroke-width:2.5;stroke-linecap:round;
            stroke-dasharray:14 210;animation:defile 3.2s linear infinite}
  @keyframes defile{to{stroke-dashoffset:-224}}

  .boite{fill:#150f28;stroke:rgba(168,85,247,.34);stroke-width:1.5}
  .boite-actif{animation:respire 3.2s ease-in-out infinite}
  @keyframes respire{
    0%,62%,100%{stroke:rgba(168,85,247,.34);filter:none}
    18%,42%{stroke:rgba(168,85,247,.95);filter:drop-shadow(0 0 14px rgba(168,85,247,.65))}}

  .titre{fill:#f1f5f9;font-size:13px;font-weight:700;letter-spacing:-.01em}
  .sstitre{fill:#94a3b8;font-size:10.5px;font-weight:500}
  /* Icônes vectorielles : contour seul, hérité de la palette, jamais d'emoji. */
  .icone{fill:none;stroke:#c4b5fd;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .paquet{r:5;filter:drop-shadow(0 0 8px rgba(168,85,247,.9))}

  @media (prefers-reduced-motion:reduce){
    .lien-vif,.boite-actif,.paquet{animation:none!important}
    .paquet{display:none}
  }
</style>

<div class="canevas">
  <svg viewBox="0 0 920 430" role="img"
       aria-label="Schéma animé d'un scénario d'automatisation : un e-mail entrant est analysé par un agent, puis routé vers le CRM ou vers la facturation.">
    <defs>
      <linearGradient id="flux" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>

      <!-- Les tracés sont déclarés une fois puis réutilisés : le lien visible,
           le lien lumineux et le paquet suivent exactement la même courbe. -->
      <path id="t1" d="M 196 215 C 258 215, 258 215, 320 215"/>
      <path id="t2" d="M 470 215 C 528 215, 528 215, 586 215"/>
      <path id="t3" d="M 700 196 C 748 196, 752 120, 800 120"/>
      <path id="t4" d="M 700 234 C 748 234, 752 310, 800 310"/>
    </defs>

    <!-- ── Liens ── -->
    <use href="#t1" class="lien"/><use href="#t2" class="lien"/>
    <use href="#t3" class="lien"/><use href="#t4" class="lien"/>
    <use href="#t1" class="lien-vif"/>
    <use href="#t2" class="lien-vif" style="animation-delay:.45s"/>
    <use href="#t3" class="lien-vif" style="animation-delay:.95s"/>
    <use href="#t4" class="lien-vif" style="animation-delay:.95s"/>

    <!-- ── Nœud 1 : le déclencheur ──
         Icônes en tracés vectoriels, PAS en emoji : un emoji dépend de la
         police système, se colore tout seul et casse la cohérence de la
         palette. Deux d'entre eux ne s'affichaient d'ailleurs pas du tout. -->
    <g class="boite-actif">
      <rect x="36" y="176" width="160" height="78" rx="18" class="boite"/>
    </g>
    <g class="icone">
      <rect x="56" y="205" width="22" height="16" rx="3"/>
      <path d="M 56 208 L 67 216 L 78 208"/>
    </g>
    <text x="92" y="208" class="titre">E-mail reçu</text>
    <text x="92" y="226" class="sstitre">Déclencheur</text>

    <!-- ── Nœud 2 : l'agent ── -->
    <g class="boite-actif" style="animation-delay:.45s">
      <rect x="320" y="170" width="150" height="90" rx="18" class="boite"/>
    </g>
    <circle cx="352" cy="215" r="16" fill="url(#accent)" opacity=".95"/>
    <path d="M 352 205 L 355 212 L 362 215 L 355 218 L 352 225 L 349 218 L 342 215 L 349 212 Z"
          fill="#0b0819" opacity=".9"/>
    <text x="378" y="205" class="titre">Agent IA</text>
    <text x="378" y="222" class="sstitre">Lit, comprend,</text>
    <text x="378" y="236" class="sstitre">décide</text>

    <!-- ── Nœud 3 : l'aiguillage ── -->
    <g class="boite-actif" style="animation-delay:.95s">
      <rect x="586" y="182" width="114" height="66" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <path d="M 604 222 L 611 222 C 615 222, 615 208, 619 208 L 625 208"/>
      <path d="M 611 222 C 615 222, 615 234, 619 234 L 625 234"/>
      <circle cx="604" cy="222" r="2.6" fill="url(#accent)" stroke="none"/>
    </g>
    <text x="634" y="209" class="titre">Routage</text>
    <text x="634" y="226" class="sstitre">Selon le cas</text>

    <!-- ── Sorties ── -->
    <g class="boite-actif" style="animation-delay:1.35s">
      <rect x="800" y="88" width="98" height="64" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <circle cx="822" cy="114" r="4.5"/>
      <path d="M 815 126 C 815 120, 829 120, 829 126"/>
    </g>
    <text x="838" y="115" class="titre">CRM</text>
    <text x="838" y="132" class="sstitre">Fiche créée</text>

    <g class="boite-actif" style="animation-delay:1.35s">
      <rect x="800" y="278" width="98" height="64" rx="16" class="boite"/>
    </g>
    <g class="icone">
      <rect x="815" y="298" width="15" height="19" rx="2.5"/>
      <path d="M 819 304 L 826 304 M 819 309 L 826 309 M 819 313 L 823 313"/>
    </g>
    <text x="838" y="305" class="titre">Devis</text>
    <text x="838" y="322" class="sstitre">Envoyé</text>

    <!-- ── Paquets qui circulent ── -->
    <circle class="paquet" fill="#c4b5fd">
      <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#t1"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#a855f7">
      <animateMotion dur="3.2s" begin="0.45s" repeatCount="indefinite">
        <mpath href="#t2"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#06b6d4">
      <animateMotion dur="3.2s" begin="0.95s" repeatCount="indefinite">
        <mpath href="#t3"/></animateMotion>
    </circle>
    <circle class="paquet" fill="#06b6d4">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite">
        <mpath href="#t4"/></animateMotion>
    </circle>
  </svg>
</div>
