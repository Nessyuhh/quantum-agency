<meta charset="utf-8">
<title>Hero Audit IA — balayage révélateur</title>
<link rel="stylesheet" href="hero-commun.css">
<style>
  /* Mécanique propre à cette page : la RÉVÉLATION.
     Un audit, c'est passer sur l'existant et faire apparaître ce qu'on n'y
     voyait pas. Le mouvement doit donc dévoiler, pas circuler. */
  .sonde{ animation:balaye 6s cubic-bezier(.45,0,.2,1) infinite }
  /* 884 et non 690 : la dernière colonne de tuiles finit à x=846, la sonde
     doit la dépasser. À 690 elle s'arrêtait au milieu du dernier bloc. */
  @keyframes balaye{ 0%{transform:translateX(0)} 72%,100%{transform:translateX(884px)} }

  /* Chaque colonne s'allume quand la sonde l'a dépassée — le décalage encode le
     balayage lui-même : c'est la sonde qui cause la révélation, pas le hasard.
     ⚠️ Le décalage passe par animation-delay et NON par un sélecteur de keyframe
     calculé : calc() et var() sont interdits dans un sélecteur de @keyframes.
     Les retards sont calés sur le temps de passage réel de la sonde, qui met
     72 % de 6 s pour parcourir 690 px — soit ~0,4 s, 1,7 s, 2,9 s et 4,2 s aux
     abscisses 58, 262, 466 et 670. */
  .tuile     { fill:var(--nuit-clair); stroke:rgba(168,85,247,.16); stroke-width:1.4 }
  .tuile-vue { animation:decouvre 6s ease-out infinite both }
  @keyframes decouvre{
    0%,4%    { stroke:rgba(168,85,247,.16); fill:var(--nuit-clair) }
    9%,90%   { stroke:rgba(168,85,247,.55); fill:#1d1436 }
    100%     { stroke:rgba(168,85,247,.16); fill:var(--nuit-clair) }
  }
  .note{ opacity:0; animation:surgit 6s ease-out infinite both }
  @keyframes surgit{
    0%,4%    { opacity:0 }
    12%,90%  { opacity:1 }
    100%     { opacity:0 }
  }
  .c1{ animation-delay:.35s } .c2{ animation-delay:1.35s }
  .c3{ animation-delay:2.3s } .c4{ animation-delay:3.3s }
  .fort{ fill:#4ade80 } .moyen{ fill:var(--amber) } .faible{ fill:var(--sourd) }
</style>

<body class="apercu">
<h1>Audit IA — le balayage révèle</h1>
<p>Un audit ne « décrit » pas : il passe sur l'existant et fait apparaître ce qu'on n'y voyait pas.
Le mouvement dévoile au lieu de circuler, et chaque gisement ne s'allume qu'<em>après</em> le
passage de la sonde — c'est elle qui cause la découverte.</p>

<div class="canevas">
  <svg class="large" viewBox="0 0 920 430" role="img"
       aria-label="Balayage d'audit sur douze processus de l'entreprise : chaque processus est
                   noté au passage de la sonde, du potentiel faible au potentiel fort.">
    <defs>
      <linearGradient id="flux" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="sonde" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
        <stop offset="50%" stop-color="#a855f7" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="sillage" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
        <stop offset="100%" stop-color="#a855f7" stop-opacity=".22"/>
      </linearGradient>
    </defs>

    <text x="58" y="62" class="etiq">Processus analysés</text>

    <!-- Le sillage passe DERRIÈRE les tuiles.
         Peint par-dessus, il les assombrissait au moment exact où la sonde les
         atteint — il contrariait donc la révélation au lieu de la servir. Seul
         le trait net reste au premier plan, tout à la fin du document. -->
    <g class="sonde">
      <rect x="-120" y="74" width="120" height="230" fill="url(#sillage)"/>
    </g>

    <!-- Les douze processus de l'entreprise -->
    <g id="tuiles">
      <g><rect class="tuile tuile-vue c1" x="58"  y="86"  width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c1" x="58"  y="160" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c1" x="58"  y="234" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c2" x="262" y="86"  width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c2" x="262" y="160" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c2" x="262" y="234" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c3" x="466" y="86"  width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c3" x="466" y="160" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c3" x="466" y="234" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c4" x="670" y="86"  width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c4" x="670" y="160" width="176" height="58" rx="13"/></g>
      <g><rect class="tuile tuile-vue c4" x="670" y="234" width="176" height="58" rx="13"/></g>
    </g>

    <!-- Libellés : toujours lisibles, même à l'arrêt -->
    <g class="titre" style="font-size:12px">
      <text x="76" y="112">Devis &amp; relances</text>
      <text x="76" y="186">Saisie comptable</text>
      <text x="76" y="260">Support client</text>
      <text x="280" y="112">Suivi de chantier</text>
      <text x="280" y="186">Reporting</text>
      <text x="280" y="260">Recrutement</text>
      <text x="484" y="112">Appels d'offres</text>
      <text x="484" y="186">Achats</text>
      <text x="484" y="260">Planning</text>
      <text x="688" y="112">Facturation</text>
      <text x="688" y="186">Veille</text>
      <text x="688" y="260">Archivage</text>
    </g>

    <!-- Les notes : ce que le balayage a trouvé -->
    <g class="sstitre" style="font-size:10px;font-weight:700">
      <g class="note c1"><text x="76"  y="130" class="fort">Potentiel fort · 8,4 h/sem</text></g>
      <g class="note c1"><text x="76"  y="204" class="fort">Potentiel fort · 6,1 h/sem</text></g>
      <g class="note c1"><text x="76"  y="278" class="moyen">Moyen · 3,2 h/sem</text></g>
      <g class="note c2"><text x="280" y="130" class="moyen">Moyen · 2,8 h/sem</text></g>
      <g class="note c2"><text x="280" y="204" class="fort">Potentiel fort · 5,5 h/sem</text></g>
      <g class="note c2"><text x="280" y="278" class="faible">Faible · humain requis</text></g>
      <g class="note c3"><text x="484" y="130" class="fort">Potentiel fort · 9,7 h/sem</text></g>
      <g class="note c3"><text x="484" y="204" class="moyen">Moyen · 2,1 h/sem</text></g>
      <g class="note c3"><text x="484" y="278" class="moyen">Moyen · 4,0 h/sem</text></g>
      <g class="note c4"><text x="688" y="130" class="fort">Potentiel fort · 7,2 h/sem</text></g>
      <g class="note c4"><text x="688" y="204" class="faible">Faible · déjà outillé</text></g>
      <g class="note c4"><text x="688" y="278" class="moyen">Moyen · 1,9 h/sem</text></g>
    </g>

    <!-- Le trait de sonde, au premier plan : lui seul doit passer devant. -->
    <g class="sonde">
      <rect x="-1.4" y="66" width="2.8" height="246" fill="url(#sonde)"/>
      <circle cx="0" cy="66" r="4" fill="#a855f7"/>
      <circle cx="0" cy="312" r="4" fill="#06b6d4"/>
    </g>

    <!-- Le total, qui n'a de sens qu'une fois le balayage terminé -->
    <g class="revele" style="animation-duration:6s;animation-delay:.4s">
      <rect x="58" y="330" width="788" height="52" rx="14" class="boite"/>
      <text x="80" y="353" class="etiq">Total identifié</text>
      <text x="80" y="371" class="titre" style="font-size:15px">
        50,9 h par semaine récupérables sur 12 processus
      </text>
    </g>
  </svg>

  <svg class="etroit" viewBox="0 0 420 700" role="img"
       aria-label="Balayage d'audit qui descend sur six processus, chacun noté au passage.">
    <defs>
      <linearGradient id="fluxV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%%" stop-color="#7c3aed"/><stop offset="55%%" stop-color="#a855f7"/>
        <stop offset="100%%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%%" stop-color="#a855f7"/><stop offset="100%%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="sondeV" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
        <stop offset="50%" stop-color="#a855f7" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <style>
      .sondeV{ animation:descend 6s cubic-bezier(.45,0,.2,1) infinite }
      @keyframes descend{ 0%{transform:translateY(0)} 72%,100%{transform:translateY(534px)} }
      .l1{animation-delay:.4s} .l2{animation-delay:1.1s} .l3{animation-delay:1.8s}
      .l4{animation-delay:2.5s} .l5{animation-delay:3.2s} .l6{animation-delay:3.9s}
    </style>
    <text x="34" y="42" class="etiq">Processus analysés</text>
    <rect class="tuile tuile-vue l1" x="26" y="62" width="368" height="72" rx="15"/>
    <text x="48" y="92" class="titre" style="font-size:14px">Devis & relances</text>
    <g class="note l1"><text x="48" y="114" class="fort" style="font-size:12px;font-weight:700">Potentiel fort · 8,4 h/sem</text></g>
    <rect class="tuile tuile-vue l2" x="26" y="150" width="368" height="72" rx="15"/>
    <text x="48" y="180" class="titre" style="font-size:14px">Saisie comptable</text>
    <g class="note l2"><text x="48" y="202" class="fort" style="font-size:12px;font-weight:700">Potentiel fort · 6,1 h/sem</text></g>
    <rect class="tuile tuile-vue l3" x="26" y="238" width="368" height="72" rx="15"/>
    <text x="48" y="268" class="titre" style="font-size:14px">Support client</text>
    <g class="note l3"><text x="48" y="290" class="moyen" style="font-size:12px;font-weight:700">Moyen · 3,2 h/sem</text></g>
    <rect class="tuile tuile-vue l4" x="26" y="326" width="368" height="72" rx="15"/>
    <text x="48" y="356" class="titre" style="font-size:14px">Suivi de chantier</text>
    <g class="note l4"><text x="48" y="378" class="moyen" style="font-size:12px;font-weight:700">Moyen · 2,8 h/sem</text></g>
    <rect class="tuile tuile-vue l5" x="26" y="414" width="368" height="72" rx="15"/>
    <text x="48" y="444" class="titre" style="font-size:14px">Appels d'offres</text>
    <g class="note l5"><text x="48" y="466" class="fort" style="font-size:12px;font-weight:700">Potentiel fort · 9,7 h/sem</text></g>
    <rect class="tuile tuile-vue l6" x="26" y="502" width="368" height="72" rx="15"/>
    <text x="48" y="532" class="titre" style="font-size:14px">Facturation</text>
    <g class="note l6"><text x="48" y="554" class="fort" style="font-size:12px;font-weight:700">Potentiel fort · 7,2 h/sem</text></g>
    <g class="sondeV">
      <rect x="26" y="-1.6" width="368" height="3.2" fill="url(#sondeV)"/>
      <circle cx="26" cy="0" r="4" fill="#a855f7"/><circle cx="394" cy="0" r="4" fill="#06b6d4"/>
    </g>
    <g class="revele" style="animation-duration:6s;animation-delay:.4s">
      <rect x="26" y="618" width="368" height="56" rx="14" class="boite"/>
      <text x="46" y="642" class="etiq">Total identifié</text>
      <text x="46" y="662" class="titre" style="font-size:14px">50,9 h par semaine récupérables</text>
    </g>
  </svg>
</div>
