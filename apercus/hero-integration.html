<meta charset="utf-8">
<title>Hero Intégration IA — l'enclenchement</title>
<link rel="stylesheet" href="hero-commun.css">
<style>
  /* Mécanique : l'ENCLENCHEMENT.
     Une intégration, ce n'est pas un flux qui circule — c'est un AVANT et un
     APRÈS. Deux ensembles séparés, une pièce qui vient s'emboîter, et alors
     seulement les données passent. Le mouvement doit montrer la bascule. */
  .gauche{ animation:rapproche-g 7s cubic-bezier(.5,0,.2,1) infinite }
  .droite{ animation:rapproche-d 7s cubic-bezier(.5,0,.2,1) infinite }
  @keyframes rapproche-g{ 0%,10%{transform:translateX(-46px)} 34%,100%{transform:translateX(0)} }
  @keyframes rapproche-d{ 0%,10%{transform:translateX(46px)}  34%,100%{transform:translateX(0)} }

  /* La pièce d'intégration descend et se verrouille. */
  .piece{ animation:emboite 7s cubic-bezier(.34,1.4,.5,1) infinite }
  @keyframes emboite{
    0%,14%{ transform:translateY(-58px); opacity:0 }
    36%   { transform:translateY(0);     opacity:1 }
    100%  { transform:translateY(0);     opacity:1 }
  }
  /* Le « clic » : une onde brève au moment exact de l'emboîtement. */
  .onde{ opacity:0; animation:clic 7s ease-out infinite }
  @keyframes clic{ 0%,34%{opacity:0;r:16} 40%{opacity:.55;r:52} 50%,100%{opacity:0;r:64} }

  /* Les données ne circulent QU'APRÈS. C'est tout le propos. */
  .apres{ opacity:0; animation:puis 7s linear infinite }
  @keyframes puis{ 0%,40%{opacity:0} 48%,92%{opacity:1} 100%{opacity:0} }
  .lien-vif{ animation-duration:1.6s }
</style>

<body class="apercu">
<h1>Intégration IA — l'enclenchement</h1>
<p>Une intégration n'est pas un flux, c'est un <em>avant</em> et un <em>après</em>. Vos outils
existent déjà et fonctionnent séparément ; la pièce vient s'emboîter, et alors seulement les
données passent. Le mouvement montre la bascule, pas la circulation.</p>

<div class="canevas">
  <svg class="large" viewBox="0 0 920 430" role="img"
       aria-label="Deux ensembles d'outils métier séparés, une brique d'intégration qui vient
                   s'emboîter entre eux, puis les données qui circulent d'un côté à l'autre.">
    <defs>
      <linearGradient id="flux" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
      <path id="g1" d="M 268 128 C 330 128, 340 190, 396 190"/>
      <path id="g2" d="M 268 215 C 330 215, 340 215, 396 215"/>
      <path id="g3" d="M 268 302 C 330 302, 340 240, 396 240"/>
      <path id="d1" d="M 524 190 C 580 190, 590 128, 652 128"/>
      <path id="d2" d="M 524 215 C 580 215, 590 215, 652 215"/>
      <path id="d3" d="M 524 240 C 580 240, 590 302, 652 302"/>
    </defs>

    <text x="58" y="62" class="etiq">Vos outils actuels</text>
    <text x="700" y="62" class="etiq">Vos outils actuels</text>

    <!-- ── Ensemble de gauche ── -->
    <g class="gauche">
      <rect x="58" y="102" width="210" height="52" rx="14" class="boite"/>
      <rect x="58" y="189" width="210" height="52" rx="14" class="boite"/>
      <rect x="58" y="276" width="210" height="52" rx="14" class="boite"/>
      <g class="icone">
        <rect x="78" y="119" width="19" height="19" rx="4"/>
        <path d="M 82 128 L 93 128 M 87.5 123 L 87.5 133"/>
        <circle cx="87.5" cy="215" r="9"/><path d="M 87.5 210 L 87.5 215 L 91 218"/>
        <rect x="78" y="293" width="19" height="19" rx="4"/>
        <path d="M 82 299 L 93 299 M 82 305 L 93 305 M 82 310 L 89 310"/>
      </g>
      <g class="titre" style="font-size:12.5px">
        <text x="110" y="133">CRM</text>
        <text x="110" y="220">ERP</text>
        <text x="110" y="307">Messagerie</text>
      </g>
    </g>

    <!-- ── Ensemble de droite ── -->
    <g class="droite">
      <rect x="652" y="102" width="210" height="52" rx="14" class="boite"/>
      <rect x="652" y="189" width="210" height="52" rx="14" class="boite"/>
      <rect x="652" y="276" width="210" height="52" rx="14" class="boite"/>
      <g class="icone">
        <path d="M 674 128 L 681 121 L 688 128 L 681 135 Z"/>
        <rect x="672" y="206" width="18" height="18" rx="4"/><path d="M 676 215 L 686 215"/>
        <circle cx="681" cy="302" r="9"/><path d="M 677 302 L 685 302 M 681 298 L 681 306"/>
      </g>
      <g class="titre" style="font-size:12.5px">
        <text x="702" y="133">Comptabilité</text>
        <text x="702" y="220">Planning</text>
        <text x="702" y="307">Reporting</text>
      </g>
    </g>

    <!-- ── La pièce qui s'emboîte ── -->
    <g class="piece">
      <circle cx="460" cy="215" r="16" class="onde" fill="none"
              stroke="url(#accent)" stroke-width="2"/>
      <rect x="396" y="164" width="128" height="102" rx="22" class="boite"
            stroke="rgba(168,85,247,.8)"
            style="filter:drop-shadow(0 0 22px rgba(168,85,247,.45))"/>
      <circle cx="460" cy="196" r="15" fill="url(#accent)"/>
      <path d="M 460 187 L 463 193 L 469 196 L 463 199 L 460 205 L 457 199 L 451 196 L 457 193 Z"
            fill="#0b0819" opacity=".9"/>
      <text x="460" y="228" class="titre" text-anchor="middle">Couche IA</text>
      <text x="460" y="245" class="sstitre" text-anchor="middle">Quantum</text>
    </g>

    <!-- ── Les données, seulement une fois la pièce en place ── -->
    <g class="apres">
      <use href="#g1" class="lien"/><use href="#g2" class="lien"/><use href="#g3" class="lien"/>
      <use href="#d1" class="lien"/><use href="#d2" class="lien"/><use href="#d3" class="lien"/>
      <use href="#g1" class="lien-vif"/>
      <use href="#g2" class="lien-vif" style="animation-delay:.2s"/>
      <use href="#g3" class="lien-vif" style="animation-delay:.4s"/>
      <use href="#d1" class="lien-vif" style="animation-delay:.6s"/>
      <use href="#d2" class="lien-vif" style="animation-delay:.8s"/>
      <use href="#d3" class="lien-vif" style="animation-delay:1s"/>
    </g>

    <!-- Ce que l'intégration ne change PAS : l'argument commercial réel. -->
    <g class="apres" style="animation-delay:.3s">
      <text x="460" y="370" class="sstitre" text-anchor="middle" style="font-size:11.5px">
        Aucun outil remplacé · aucune migration · vos données restent chez vous
      </text>
    </g>
  </svg>

  <svg class="etroit" viewBox="0 0 420 700" role="img"
       aria-label="Deux ensembles d'outils séparés, une brique d'intégration qui s'emboîte entre eux, puis les données qui circulent.">
    <defs>      <linearGradient id="fluxV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#06b6d4"/></linearGradient>
      <linearGradient id="accentV" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
      <path id="gv1" d="M 130 210 C 130 246, 150 246, 150 282"/>
      <path id="gv2" d="M 290 210 C 290 246, 270 246, 270 282"/>
      <path id="dv1" d="M 150 418 C 150 454, 130 454, 130 490"/>
      <path id="dv2" d="M 270 418 C 270 454, 290 454, 290 490"/>
    </defs>
    <style>
      .hautV{ animation:rappH 7s cubic-bezier(.5,0,.2,1) infinite }
      .basV { animation:rappB 7s cubic-bezier(.5,0,.2,1) infinite }
      @keyframes rappH{ 0%,10%{transform:translateY(-40px)} 34%,100%{transform:translateY(0)} }
      @keyframes rappB{ 0%,10%{transform:translateY(40px)}  34%,100%{transform:translateY(0)} }
      .pieceV{ animation:emboiteV 7s cubic-bezier(.34,1.4,.5,1) infinite }
      @keyframes emboiteV{ 0%,14%{transform:translateX(-70px);opacity:0}
                            36%,100%{transform:translateX(0);opacity:1} }
      .lien-vif{ animation-duration:1.6s }
    </style>
    <text x="34" y="40" class="etiq">Vos outils actuels</text>
    <g class="hautV">
      <rect x="34" y="58" width="352" height="58" rx="15" class="boite"/>
      <rect x="34" y="126" width="352" height="58" rx="15" class="boite"/>
      <g class="titre" style="font-size:14px"><text x="60" y="93">CRM</text><text x="60" y="161">ERP</text></g>
    </g>
    <g class="basV">
      <rect x="34" y="516" width="352" height="58" rx="15" class="boite"/>
      <rect x="34" y="584" width="352" height="58" rx="15" class="boite"/>
      <g class="titre" style="font-size:14px"><text x="60" y="551">Comptabilité</text>
        <text x="60" y="619">Reporting</text></g>
    </g>
    <g class="pieceV">
      <rect x="90" y="282" width="240" height="136" rx="24" class="boite" stroke="rgba(168,85,247,.8)"
            style="filter:drop-shadow(0 0 24px rgba(168,85,247,.45))"/>
      <circle cx="210" cy="330" r="19" fill="url(#accentV)"/>
      <path d="M 210 318 L 214 326 L 222 330 L 214 334 L 210 342 L 206 334 L 198 330 L 206 326 Z"
            fill="#0b0819" opacity=".9"/>
      <text x="210" y="374" class="titre" text-anchor="middle" style="font-size:15px">Couche IA</text>
      <text x="210" y="396" class="sstitre" text-anchor="middle">Quantum</text>
    </g>
    <g class="apres">
      <use href="#gv1" class="lien"/><use href="#gv2" class="lien"/>
      <use href="#dv1" class="lien"/><use href="#dv2" class="lien"/>
      <use href="#gv1" class="lien-vif" style="stroke:url(#fluxV)"/>
      <use href="#gv2" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.3s"/>
      <use href="#dv1" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.6s"/>
      <use href="#dv2" class="lien-vif" style="stroke:url(#fluxV);animation-delay:.9s"/>
    </g>
    <g class="apres" style="animation-delay:.3s">
      <text x="210" y="672" class="sstitre" text-anchor="middle" style="font-size:12px">
        Aucun outil remplacé · aucune migration</text>
    </g>
  </svg>
</div>
</body>
